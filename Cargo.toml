[package]
name = "texio-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reliable Markdown operations for shell scripts and AI agents"
readme = "README.md"
keywords = ["markdown", "cli", "automation", "agents", "commonmark"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
pulldown-cmark = "0.13"
similar = "2.7"
tempfile = "3.23"

[[bin]]
name = "texio"
path = "src/main.rs"
