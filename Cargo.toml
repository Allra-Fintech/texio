[package]
name = "texio-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reliable Markdown operations for shell scripts and AI agents"
readme = "README.md"
keywords = ["markdown", "cli", "automation", "agents", "commonmark"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.13"
serde_json = "1.0"
similar = "2.7"
tempfile = "3.23"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "texio"
path = "src/main.rs"
