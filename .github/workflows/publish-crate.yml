name: Publish crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      confirmation:
        description: Type "publish" to authorize the irreversible upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = publish

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag and branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Verify package contents
        run: |
          cargo test --locked
          cargo package --locked
          cargo publish --dry-run --locked

      - name: Publish texio-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
