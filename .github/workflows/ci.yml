name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Verify release tag preflight
        if: runner.os == 'Linux'
        run: python3 scripts/test-release-tag.py
      - name: Verify launch demonstration
        shell: bash
        run: |
          cargo build --locked
          python3 scripts/launch-demo.py --texio "target/debug/texio${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Reproduce assisted workflow comparisons
        shell: bash
        run: python3 scripts/reproduce-assisted-cases.py --texio "target/debug/texio${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Verify comparison version evidence
        shell: bash
        run: python3 scripts/test-assisted-version.py
      - name: Verify practitioner kit mechanics
        shell: bash
        run: python3 -O scripts/check-practitioner-kit.py --texio "target/debug/texio${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Reproduce benchmark
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          bash scripts/test-recipes.sh target/release/texio
          python3 benchmarks/run.py --texio target/release/texio --release ci --output /tmp/texio-benchmark.json
          python3 benchmarks/check.py /tmp/texio-benchmark.json
      - name: Reproduce structural comparison
        if: runner.os == 'Linux'
        run: |
          python3 benchmarks/structural/run.py --texio target/release/texio --runs 3 --output "$RUNNER_TEMP/structural.json"
          python3 benchmarks/structural/check.py "$RUNNER_TEMP/structural.json"
          python3 -O benchmarks/structural/test-check.py "$RUNNER_TEMP/structural.json"
      - name: Verify recorded section demonstration
        if: runner.os == 'Linux'
        run: |
          python3 -O scripts/record-section-demo.py --texio target/release/texio --output-dir "$RUNNER_TEMP/section-demo"
          python3 -O scripts/check-section-demo.py "$RUNNER_TEMP/section-demo"
          python3 -O scripts/test-section-demo.py --texio target/release/texio --generated "$RUNNER_TEMP/section-demo"
